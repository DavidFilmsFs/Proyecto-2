<div class="card" style="position: relative; overflow: hidden;">

  <div class="card-image">
    <figure class="image" style="height: 250px;">
     <img src="Fondo ninjago.jpg" alt="Fondo de Ninjago">

  <div 
    class="is-overlay is-flex is-flex-direction-column is-justify-content-flex-end p-6"
    style="background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));">
    <div class="container">
      <span class="tag is-warning is-light has-text-weight-bold is-uppercase mb-20">
        Personajes de
      </span>
      <h1 class="title is-1 has-text-white"  style="font-size: 80px">
       NINJAGO
      </h1>
      <h2 class="subtitle is-5 has-text-warning has-text-weight-semibold"  style="font-size: 40px">
        Y su historia
      </h2>
    </div>

 </div>

    <main>
      <section class="section">
        <div class="container">
          <h2 class="title">Personajes de Ninjago</h2>
          <div class="columns is-vcentered is-multiline">
            <div class="column">
              <label class="label" for="buscarPersonaje">Buscar por nombre o poder/rol</label>
              <input class="input" id="buscarPersonaje" type="search" placeholder="Ej. Kai o Fuego" autocomplete="off">
            </div>
            <div class="column is-narrow">
              <button class="button is-danger" id="agregarPersonaje" type="button">Agregar personaje</button>
            </div>
          </div>
          <p id="contadorPersonajes" class="help mb-4" aria-live="polite"></p>
          <div id="listaPersonajes" class="columns is-multiline"></div>
          <p id="estadoVacio" class="has-text-grey" hidden>No hay personajes que coincidan con la búsqueda.</p>
        </div>
      </section>
    </main>

    <template id="plantillaPersonaje">
      <div class="column is-12-mobile is-6-tablet is-4-desktop">
        <article class="card" data-id="">
          <button class="card-summary" type="button" aria-expanded="false">
            <img class="imagen-personaje card-summary-image" src="" alt="">
            <span class="title is-4 card-summary-title nombre"></span>
          </button>
          <div class="card-content card-details" hidden>
            <div class="content">
              <p><strong>Poder elemental:</strong> <span class="poder"></span></p>
              <p><strong>Origen:</strong> <span class="origen"></span></p>
              <p><strong>Padres:</strong> <span class="padres"></span></p>
              <p><strong>Descripción:</strong> <span class="descripcion"></span></p>
              <p><strong>Primera aparición:</strong> <span class="aparicion"></span></p>
              <div class="card-actions is-flex is-justify-content-flex-end">
                <button class="button is-small boton-editar" type="button">Editar</button>
                <button class="button is-small is-danger is-light boton-eliminar" type="button">Eliminar</button>
              </div>
            </div>
          </div>
        </article>
      </div>
    </template>

    <dialog class="personaje-dialog" id="dialogoPersonaje" aria-labelledby="tituloDialogoPersonaje">
      <form id="formularioPersonaje">
        <header class="personaje-dialog-header is-flex is-justify-content-space-between is-align-items-center">
          <h2 class="title is-4 mb-0" id="tituloDialogoPersonaje">Agregar personaje</h2>
          <button class="delete" id="cerrarDialogo" type="button" aria-label="Cerrar"></button>
        </header>
        <div class="p-5">
          <div class="field"><label class="label" for="nombrePersonaje">Nombre *</label><input class="input" id="nombrePersonaje" name="Nombre" required maxlength="100"></div>
          <div class="field"><label class="label" for="poderPersonaje">Poder elemental o rol *</label><input class="input" id="poderPersonaje" name="Poder_elemental" required maxlength="80"></div>
          <div class="field"><label class="label" for="origenPersonaje">Origen *</label><input class="input" id="origenPersonaje" name="Origen" required maxlength="100"></div>
          <div class="field"><label class="label" for="padresPersonaje">Padres</label><input class="input" id="padresPersonaje" name="Padres" maxlength="160"></div>
          <div class="field"><label class="label" for="descripcionPersonaje">Descripción</label><textarea class="textarea" id="descripcionPersonaje" name="descripcion" maxlength="500"></textarea></div>
          <div class="field"><label class="label" for="aparicionPersonaje">Primera aparición</label><input class="input" id="aparicionPersonaje" name="primera_aparicion" maxlength="100"></div>
          <div class="field"><label class="label" for="imagenPersonaje">Imagen (ruta o URL)</label><input class="input" id="imagenPersonaje" name="imagen" maxlength="500" placeholder="Ej. Kai.jpg"></div>
        </div>
        <footer class="personaje-dialog-actions is-flex is-justify-content-flex-end">
          <button class="button" id="cancelarDialogo" type="button">Cancelar</button>
          <button class="button is-danger" type="submit">Guardar personaje</button>
        </footer>
      </form>
    </dialog>

<script src="proyecto.js"></script>
